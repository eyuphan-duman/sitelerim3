<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <title>Bağlantı yok — Logos</title>
  <style>
    :root { --bg: #ffffff; --ink: #0e1726; --ink2: #56657a; --btn: #0a1628; --on: #ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg: #08111f; --ink: #e7ecf3; --ink2: #8a96a8; --btn: #e7ecf3; --on: #08111f; } }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 24px; text-align: center; }
    img { width: 88px; height: 88px; margin-bottom: 24px; }
    h1 { font-size: 1.35rem; margin: 0 0 8px; }
    p { margin: 0 0 24px; color: var(--ink2); line-height: 1.5; max-width: 320px; }
    button { height: 44px; padding: 0 24px; border: 0; border-radius: 999px; background: var(--btn); color: var(--on); font: inherit; font-weight: 700; font-size: 1rem; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/logos-192.png" alt="" />
    <h1>İnternet bağlantısı yok</h1>
    <p>Logos'u kullanmak için internete bağlı olmalısın. Bağlantın gelince yeniden dene.</p>
    <button type="button" onclick="location.reload()">Yeniden dene</button>
  </main>
  <script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
